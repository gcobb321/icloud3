[pytest]
# The tests build their own Home Assistant instance (support/harness.py), so the
# pytest-homeassistant-custom-component plugin is not loaded; the package is only
# used to install the matching Home Assistant, pytest and pytest-asyncio versions.
addopts = -p no:homeassistant -p no:cacheprovider -rfEs
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
