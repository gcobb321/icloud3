iCloud3 Theme:
  card-mod-theme: iCloud3 Theme
  card-mod-dialog: |
    ha-dialog {
      --mdc-typography-body1-font-size: 13px;
      --mdc-typography-body2-font-size: 13px;
    }
    mwc-list-item, ha-formfield, ha-radio, ha-checkbox {
      --mdc-list-item-graphic-margin: 8px;
      min-height: 32px !important;
      --mdc-icon-button-size: 32px;
    }
    .mdc-form-field {
      margin: 0 !important;
      padding: 2px 0 !important;
    }

  modes:
    light:
      # Text field label, Select box label, hh.mm.ss label
      mdc-text-field-label-ink-color: rgb(9, 119, 170)
      # Field label text box, time text, boolean field text, option bullet text
      mdc-theme-text-primary-on-background: rgb(0, 0, 0)
      # Description text color
      mdc-dialog-content-ink-color: rgb(10, 136, 194)
      # Text entry heading, Dropdown box label, Description text
      mdc-dialog-content-heading-ink-color: rgb(9, 119, 170)
      wa-form-control-label-color: rgb(9, 119, 170)
      secondary-text-color: rgb(9, 119, 170)
      ha-color-text-secondary: rgb(9, 119, 170)
      # Select item heading
      mdc-select-label-ink-color: rgb(9, 119, 170)

    dark:
      # Text field label, Select box label, hh.mm.ss label
      mdc-text-field-label-ink-color: salmon
      # Field label text box, time text, boolean field text, option bullet text
      mdc-theme-text-primary-on-background: rgb(255, 255, 255)

      # Description text color
      mdc-dialog-content-ink-color: salmon

      # Text entry heading, Dropdown box label, Description text
      mdc-dialog-content-heading-ink-color: salmon
      # WebAwesome config-flow fields (no -- prefix; HA adds it). Confirmed by
      # toggle test: wa-form-control-label-color drives the field heading +
      # dropdown descriptions; secondary-text-color is broad (tints most
      # secondary text UI-wide); ha-color-text-secondary had no effect (no-op).
      wa-form-control-label-color: salmon
      secondary-text-color: salmon
      #ha-color-text-secondary: salmon

      # Select item heading
      mdc-select-label-ink-color: salmon

      # Config-flow dialog window background
      ha-dialog-surface-background: rgb(40, 46, 54)
