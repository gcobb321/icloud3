name: Waze Route Regression Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  waze-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Run mocked Waze tests (no live traffic)
        run: python -m pytest -q tests/test_waze_hotfix.py
